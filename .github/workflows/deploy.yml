name: deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build and push image
    runs-on: [self-hosted, linux, vctcn, netbird]
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
    env:
      REGISTRY: registry.237575.xyz
      IMAGE: registry.237575.xyz/fulcrum/app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: network=host

      - name: Resolve image tag
        id: meta
        run: |
          set -euo pipefail
          short_sha="${GITHUB_SHA::12}"
          echo "tag=${IMAGE}:${GITHUB_SHA}" | tee -a "$GITHUB_OUTPUT"
          echo "short_tag=${IMAGE}:${short_sha}" | tee -a "$GITHUB_OUTPUT"

      - name: Get Keycloak access token
        id: registry-token
        uses: Mouriya-Emma/keycloak-token-action@v1
        with:
          keycloak-url: https://keycloak.237575.xyz
          realm: registry
          client-id: registry
          client-secret: ${{ secrets.REGISTRY_KEYCLOAK_CLIENT_SECRET }}

      - name: Login to registry.237575.xyz
        run: echo "${{ steps.registry-token.outputs.access-token }}" | docker login "$REGISTRY" -u sa-registry --password-stdin

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.short_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Pull verification
        run: |
          set -euo pipefail
          docker pull "${{ steps.meta.outputs.tag }}"
          docker image inspect "${{ steps.meta.outputs.tag }}" >/dev/null

  deploy:
    name: Deploy Komodo stack
    needs: build
    runs-on: [self-hosted, linux, vctcn, netbird]
    # homelab-apps ResourceSync also writes Stack fulcrum. This repo-scoped group
    # cannot serialize that cross-repo race: https://github.com/mouriya-s-lab/garm-edge-incus/issues/15
    concurrency:
      group: komodo-stack-fulcrum
      cancel-in-progress: false
      queue: max
    steps:
      - name: Komodo UpdateStack — pin image tag
        env:
          KOMODO_URL: http://moat-app1.mouriya.lan:9120
          KOMODO_API_KEY: ${{ secrets.KOMODO_API_KEY }}
          KOMODO_API_SECRET: ${{ secrets.KOMODO_API_SECRET }}
          IMAGE_TAG: ${{ needs.build.outputs.image_tag }}
        run: |
          set -euo pipefail
          variable_response="$RUNNER_TEMP/fulcrum-version-variable.json"
          get_variable=$(jq -nc '{
            type: "GetVariable",
            params: { name: "FULCRUM_VERSION" }
          }')
          status=$(curl -sS -o "$variable_response" -w '%{http_code}' \
            -X POST "${KOMODO_URL}/read" \
            -H "x-api-key: ${KOMODO_API_KEY}" \
            -H "x-api-secret: ${KOMODO_API_SECRET}" \
            -H "Content-Type: application/json" \
            -d "$get_variable")

          case "$status" in
            200)
              variable_write=$(jq -nc --arg value "$IMAGE_TAG" '{
                type: "UpdateVariableValue",
                params: { name: "FULCRUM_VERSION", value: $value }
              }')
              ;;
            404|500)
              variable_write=$(jq -nc --arg value "$IMAGE_TAG" '{
                type: "CreateVariable",
                params: {
                  name: "FULCRUM_VERSION",
                  value: $value,
                  is_secret: false
                }
              }')
              ;;
            *)
              cat "$variable_response" >&2
              echo "::error::GetVariable FULCRUM_VERSION returned HTTP $status" >&2
              exit 1
              ;;
          esac

          curl -fsS -X POST "${KOMODO_URL}/write" \
            -H "x-api-key: ${KOMODO_API_KEY}" \
            -H "x-api-secret: ${KOMODO_API_SECRET}" \
            -H "Content-Type: application/json" \
            -d "$variable_write" >/dev/null
          echo "Updated Komodo Variable FULCRUM_VERSION=$IMAGE_TAG"

          stack=$(curl -fsS -X POST "${KOMODO_URL}/read" \
            -H "x-api-key: ${KOMODO_API_KEY}" \
            -H "x-api-secret: ${KOMODO_API_SECRET}" \
            -H "Content-Type: application/json" \
            -d '{"type":"GetStack","params":{"stack":"fulcrum"}}')
          current_environment=$(jq -r '.config.environment // ""' <<<"$stack")
          environment=$(
            sed '/^FULCRUM_VERSION=/d' <<<"$current_environment"
            printf 'FULCRUM_VERSION=%s\n' "$IMAGE_TAG"
          )

          curl -fsS -X POST "${KOMODO_URL}/write" \
            -H "x-api-key: ${KOMODO_API_KEY}" \
            -H "x-api-secret: ${KOMODO_API_SECRET}" \
            -H "Content-Type: application/json" \
            -d "$(jq -n --arg environment "$environment" '{
              type: "UpdateStack",
              params: {
                id: "fulcrum",
                config: {
                  environment: $environment
                }
              }
            }')"

      - name: Komodo DeployStack — wait for terminal success
        env:
          KOMODO_URL: http://moat-app1.mouriya.lan:9120
          KOMODO_API_KEY: ${{ secrets.KOMODO_API_KEY }}
          KOMODO_API_SECRET: ${{ secrets.KOMODO_API_SECRET }}
          IMAGE_TAG: ${{ needs.build.outputs.image_tag }}
        run: |
          set -euo pipefail
          response=$(curl -fsS -X POST "${KOMODO_URL}/execute" \
            -H "x-api-key: ${KOMODO_API_KEY}" \
            -H "x-api-secret: ${KOMODO_API_SECRET}" \
            -H "Content-Type: application/json" \
            -d '{"type":"DeployStack","params":{"stack":"fulcrum"}}')
          update_id=$(jq -er '._id."$oid"' <<<"$response")
          echo "DeployStack update id: $update_id"

          while true; do
            update=$(curl -fsS -X POST "${KOMODO_URL}/read" \
              -H "x-api-key: ${KOMODO_API_KEY}" \
              -H "x-api-secret: ${KOMODO_API_SECRET}" \
              -H "Content-Type: application/json" \
              -d "{\"type\":\"GetUpdate\",\"params\":{\"id\":\"${update_id}\"}}")
            status=$(jq -er '.status' <<<"$update")
            success=$(jq -er '.success' <<<"$update")
            echo "DeployStack status=$status success=$success"

            case "$status" in
              Complete)
                jq . <<<"$update"
                test "$success" = true
                break
                ;;
              InProgress|Queued)
                sleep 2
                ;;
              *)
                jq . <<<"$update" >&2
                echo "::error::DeployStack reached unexpected terminal state: $status" >&2
                exit 1
                ;;
            esac
          done

          stack=$(curl -fsS -X POST "${KOMODO_URL}/read" \
            -H "x-api-key: ${KOMODO_API_KEY}" \
            -H "x-api-secret: ${KOMODO_API_SECRET}" \
            -H "Content-Type: application/json" \
            -d '{"type":"GetStack","params":{"stack":"fulcrum"}}')
          deployed_image=$(jq -er '.info.deployed_services[] | select(.service_name == "fulcrum") | .image' <<<"$stack")
          test "$deployed_image" = "$IMAGE_TAG"
          echo "Verified deployed image: $deployed_image"
